# Ant Colony Manager – production stack
#
#   cp .env.example .env      # adjust PUBLIC_APP_URL (and optionally more)
#   docker compose up -d
#   docker compose ps         # all services should become "healthy"
#
# All persistent data lives in ${DATA_DIR} (default ./data):
#   postgres/  uploads/  backups/  secrets/  caddy/
# Recreating or updating containers never touches it. Only deleting that
# directory removes data.

name: ant-colony-manager

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-backup-image: &backup-image
  image: ghcr.io/daschmidt1994/ant-colony-manager-backup:${ACM_VERSION:-latest}
  build:
    context: deploy/backup

services:
  # One-shot: creates data directories with the right owner and generates
  # secrets that are not set in .env. Finishes in a second.
  init:
    <<: *backup-image
    command: ["init-dirs"]
    user: "0:0"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
      INSTANCE_SECRET: ${INSTANCE_SECRET:-}
    volumes:
      - ${DATA_DIR:-./data}:/data
    restart: "no"
    logging: *logging

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-acm}
      POSTGRES_USER: ${POSTGRES_USER:-acm}
      POSTGRES_PASSWORD_FILE: /run/acm-secrets/postgres_password
      TZ: ${TZ:-Europe/Vienna}
    volumes:
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql   # PG 18 keeps its versioned data dir below
      - ${DATA_DIR:-./data}/secrets:/run/acm-secrets:ro
    depends_on:
      init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    shm_size: 128m
    stop_grace_period: 60s
    logging: *logging
    # no published port – only reachable inside the stack

  app:
    image: ghcr.io/daschmidt1994/ant-colony-manager:${ACM_VERSION:-latest}
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        VERSION: ${ACM_VERSION:-local}
        # flutter (default) builds the web app; placeholder skips it (low-memory hosts)
        WEB_BUILD: ${ACM_WEB_BUILD:-flutter}
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-acm}
      POSTGRES_USER: ${POSTGRES_USER:-acm}
      POSTGRES_PASSWORD_FILE: /run/acm-secrets/postgres_password
      JWT_SECRET_FILE: /run/acm-secrets/jwt_secret
      INSTANCE_SECRET_FILE: /run/acm-secrets/instance_secret
      STORAGE_PATH: /data/uploads
      BACKUP_STATUS_DIR: /data/backups
      LISTEN_ADDR: ":8080"
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8080}:8080"
    volumes:
      - ${DATA_DIR:-./data}/uploads:/data/uploads
      - ${DATA_DIR:-./data}/backups:/data/backups:ro
      - ${DATA_DIR:-./data}/secrets:/run/acm-secrets:ro
      - ${DATA_DIR:-./data}/update:/data/update   # update request for the optional updater
    user: "${PUID:-1000}:${PGID:-1000}"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      db: { condition: service_healthy }
      init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "/acm", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    stop_grace_period: 30s
    logging: *logging

  backup:
    <<: *backup-image
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-acm}
      PGUSER: ${POSTGRES_USER:-acm}
      PGPASSWORD: ""                       # read from secrets/postgres_password
      POSTGRES_PASSWORD: ""                # never needed here
      TZ: ${TZ:-Europe/Vienna}
    volumes:
      - ${DATA_DIR:-./data}/uploads:/data/uploads:ro
      - ${DATA_DIR:-./data}/backups:/data/backups
      - ${DATA_DIR:-./data}/secrets:/data/secrets:ro
      - ./.env:/config/.env:ro
    user: "${PUID:-1000}:${PGID:-1000}"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 15m
      timeout: 10s
      start_period: 1m
    logging: *logging

  # Optional update button in the app. Enable with COMPOSE_PROFILES=updater
  # (and ACM_PROJECT_DIR = this folder, set by scripts/init-env.sh). It has the
  # Docker socket – that is root on the host – but only does what
  # scripts/update.sh does, when an administrator asks for it in the app.
  updater:
    profiles: [updater]
    image: docker:28-cli
    restart: unless-stopped
    entrypoint: ["/bin/sh", "${ACM_PROJECT_DIR:-/missing}/deploy/updater/updater.sh"]
    environment:
      ACM_PROJECT_DIR: ${ACM_PROJECT_DIR:-}
      COMPOSE_PROJECT_NAME: ant-colony-manager
    working_dir: ${ACM_PROJECT_DIR:-/missing}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${ACM_PROJECT_DIR:-/missing}:${ACM_PROJECT_DIR:-/missing}
      - ${DATA_DIR:-./data}/update:/data/update
    depends_on:
      init: { condition: service_completed_successfully }
    logging: *logging

  # Optional HTTPS reverse proxy. Enable with COMPOSE_PROFILES=proxy in .env.
  proxy:
    profiles: [proxy]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      ACM_DOMAIN: ${ACM_DOMAIN:-}
      ACM_TLS_MODE: ${ACM_TLS_MODE:-acme}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_DIR:-./data}/caddy/data:/data
      - ${DATA_DIR:-./data}/caddy/config:/config
    depends_on:
      app: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
    logging: *logging

networks:
  default:
    ipam:
      config:
        - subnet: ${ACM_SUBNET:-172.30.47.0/24}
