openapi: 3.1.0
info:
  title: Ant Colony Manager API
  version: "1"
  description: |
    Self-hosted API for managing ant colonies. Used by the Android app and the web app.

    **Conventions**
    - All IDs are UUIDs (UUIDv7, usually generated by the client).
    - Timestamps are RFC 3339.
    - Errors use `application/problem+json` (RFC 9457) with a machine-readable `code`.
    - Resources of colonies you have no access to always answer **404** (existence is never revealed).
    - Every write (REST or sync) is idempotent: REST writes accept `Idempotency-Key` (UUID),
      sync operations carry an `op_id`.
    - Optimistic concurrency: send `If-Match: "<version>"` on PATCH; conflicting fields are merged
      (see `WriteResponse.conflicts`).
servers:
  - url: "{publicUrl}"
    variables:
      publicUrl:
        default: https://ants.example.com
security:
  - bearer: []

tags:
  - name: system
  - name: auth
  - name: sync
  - name: colonies
  - name: scan
  - name: photos
  - name: sensors
  - name: admin
  - name: collections
    description: |
      Generic CRUD for simple entities. `{collection}` is one of:
      `locations`, `food-items`, `species`, `habitats`, `queens`, `winter-rests`, `schedules`,
      `tasks`, `care-rounds`, `care-round-colonies`, `events`, `photos`, `scan-links`, `nfc-tags`, `sensors`.
      Fields per entity: see `docs/03-datenmodell.md` and `server/internal/service/entities.go`.

paths:
  /healthz:
    get:
      tags: [system]
      security: []
      summary: "Liveness probe"
      responses: { "200": { description: "ok" } }
  /readyz:
    get:
      tags: [system]
      security: []
      summary: "Readiness (database, storage, migrations)"
      responses:
        "200": { description: "ready" }
        "503": { description: "not ready" }
  /.well-known/assetlinks.json:
    get:
      tags: [system]
      security: []
      summary: "Android App Links (from ANDROID_APP_ID / ANDROID_CERT_SHA256)"
      responses: { "200": { description: "Digital Asset Links JSON" } }
  /c/{token}:
    get:
      tags: [scan]
      security: []
      summary: "Scan landing page (QR/NFC without app). Contains no colony data."
      parameters: [{ $ref: "#/components/parameters/Token" }]
      responses: { "200": { description: "HTML" } }

  /api/v1/instance:
    get:
      tags: [system]
      security: []
      summary: "Public instance information (used by the app when connecting)"
      responses:
        "200":
          description: "ok"
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  version: { type: string }
                  api_version: { type: integer }
                  public_url: { type: string }
                  legacy_urls: { type: array, items: { type: string } }
                  registration_mode: { enum: [open, invite, closed] }
                  setup_required: { type: boolean }
                  password_reset: { type: boolean, description: "true if e-mail reset is available" }

  /api/v1/setup:
    post:
      tags: [auth]
      security: []
      summary: "Create the first administrator (requires the setup token from the server log)"
      requestBody: { $ref: "#/components/requestBodies/Register" }
      responses:
        "201": { $ref: "#/components/responses/Session" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/auth/register:
    post:
      tags: [auth]
      security: []
      summary: "Register (depending on REGISTRATION_MODE; invite_token may also share a colony)"
      requestBody: { $ref: "#/components/requestBodies/Register" }
      responses:
        "201": { $ref: "#/components/responses/Session" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/auth/login:
    post:
      tags: [auth]
      security: []
      summary: "Log in. Web clients send `X-ACM-Client: web` and receive the refresh token as HttpOnly cookie."
      parameters: [{ $ref: "#/components/parameters/ClientHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
                device: { $ref: "#/components/schemas/Device" }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /api/v1/auth/refresh:
    post:
      tags: [auth]
      security: []
      summary: "Rotate the refresh token (body for apps, cookie + X-ACM-Client for web)"
      description: |
        Reusing an already rotated token after 30 s revokes the whole session family
        (`auth.token_reused`). Within 30 s the answer is `auth.token_rotated` (parallel refresh).
      parameters: [{ $ref: "#/components/parameters/ClientHeader" }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { refresh_token: { type: string } } }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: "End the current session (`?all=true` ends all sessions)"
      responses: { "204": { description: "logged out" } }
  /api/v1/auth/password/forgot:
    post:
      tags: [auth]
      security: []
      summary: "Send a reset e-mail. Always 202 (no account enumeration)."
      requestBody:
        content: { application/json: { schema: { type: object, properties: { email: { type: string } } } } }
      responses: { "202": { description: "accepted" } }
  /api/v1/auth/password/reset:
    post:
      tags: [auth]
      security: []
      summary: "Set a new password with a reset token (revokes all sessions)"
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [token, password], properties: { token: { type: string }, password: { type: string } } }
      responses:
        "204": { description: "done" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/auth/device-link:
    post:
      tags: [auth]
      summary: "Create a 2-minute code for „Android-App verbinden“ (shown as QR in the web app)"
      responses:
        "201":
          description: "code"
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string }
                  server_url: { type: string }
                  qr_payload: { type: string, example: "https://ants.example.com/link#code=…" }
                  expires_at: { type: string, format: date-time }
  /api/v1/auth/device-link/redeem:
    post:
      tags: [auth]
      security: []
      summary: "App exchanges the code for a session"
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [code], properties: { code: { type: string }, device: { $ref: "#/components/schemas/Device" } } }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/auth/sessions:
    get:
      tags: [auth]
      summary: "Active sessions / devices"
      responses: { "200": { description: "list" } }
  /api/v1/auth/sessions/{id}:
    delete:
      tags: [auth]
      summary: "Sign out a device (the app wipes local data on next contact)"
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "204": { description: "revoked" } }

  /api/v1/me:
    get:
      tags: [auth]
      summary: "Current user and the NFC UID hashing key"
      responses:
        "200":
          description: "ok"
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  nfc_uid_key: { type: string, description: "base64 key; uid_hash = hex(HMAC-SHA256(key, UID))" }
                  server_time: { type: string, format: date-time }
    patch:
      tags: [auth]
      summary: "Change display name"
      responses: { "200": { description: "ok" } }
    delete:
      tags: [auth]
      summary: "Delete account and all owned data (password required)"
      responses: { "204": { description: "deleted" } }
  /api/v1/me/settings:
    get: { tags: [auth], summary: "User settings", responses: { "200": { description: "ok" } } }
    patch: { tags: [auth], summary: "Update settings (timezone, reminders, theme …)", responses: { "200": { $ref: "#/components/responses/Write" } } }
  /api/v1/me/password:
    put:
      tags: [auth]
      summary: "Change password (other sessions are revoked)"
      responses: { "204": { description: "changed" } }

  /api/v1/sync/push:
    post:
      tags: [sync]
      summary: "Apply up to 100 operations in order, each exactly once"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/Device"
                - type: object
                  required: [ops]
                  properties:
                    ops: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/Op" } }
      responses:
        "200":
          description: "results in request order"
          content:
            application/json:
              schema:
                type: object
                properties:
                  results: { type: array, items: { $ref: "#/components/schemas/OpResult" } }
                  server_seq: { type: integer, format: int64 }
  /api/v1/sync/pull:
    get:
      tags: [sync]
      summary: "Changes after a cursor (including tombstones)"
      parameters:
        - { name: since, in: query, schema: { type: integer, format: int64, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, default: 500, maximum: 1000 } }
        - { name: X-Device-ID, in: header, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: "changes"
          content:
            application/json:
              schema:
                type: object
                properties:
                  changes: { type: array, items: { $ref: "#/components/schemas/Change" } }
                  next: { type: integer, format: int64, description: "cursor for the next pull" }
                  has_more: { type: boolean }
        "410":
          description: "cursor older than the tombstone horizon → run a snapshot (`sync.resync_required`)"
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
  /api/v1/sync/snapshot:
    get:
      tags: [sync]
      summary: "Full current state (first sync, resync, or newly shared colonies via colony_ids)"
      parameters:
        - { name: colony_ids, in: query, schema: { type: string }, description: "comma-separated UUIDs" }
      responses:
        "200":
          description: "snapshot"
          content:
            application/json:
              schema:
                type: object
                properties:
                  cursor: { type: integer, format: int64 }
                  entities: { type: object, additionalProperties: { type: array, items: { type: object } } }
  /api/v1/sync/events:
    get:
      tags: [sync]
      summary: "Server-Sent Events – `event: change` with `{\"seq\": N}` when something changed (then pull)"
      responses: { "200": { description: "text/event-stream" } }
  /api/v1/sync/conflicts:
    get:
      tags: [sync]
      summary: "Automatically resolved conflicts (losing values) for display"
      responses: { "200": { description: "list" } }
  /api/v1/sync/conflicts/{id}:
    delete:
      tags: [sync]
      summary: "Dismiss a conflict hint"
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "204": { description: "dismissed" } }

  /api/v1/dashboard:
    get:
      tags: [colonies]
      summary: "Counts, due groups (overdue/today/tomorrow/this_week/later), hibernation, problems, recent activity"
      responses: { "200": { description: "dashboard" } }
  /api/v1/export.json:
    get:
      tags: [colonies]
      summary: "Complete JSON export of all data visible to the user (format ant-colony-manager/v1)"
      responses: { "200": { description: "file download" } }
  /api/v1/export.zip:
    get:
      tags: [colonies]
      summary: "ZIP: export.json, CSV tables (semicolon, UTF-8 BOM) and all photos"
      parameters:
        - { name: photos, in: query, schema: { type: string, enum: ["0", "1"] }, description: "0 = without photos" }
      responses: { "200": { description: "file download (application/zip)" } }
  /api/v1/updates:
    get:
      tags: [system]
      summary: "Newer releases than the running server (GitHub, cached 6 h; UPDATE_CHECK=false disables). breaking=true if any newer release has breaking changes (section „⚠ Breaking Changes“ or new major version)"
      responses: { "200": { description: "{enabled, current, latest, update_available, breaking, newer[{version, url, published_at, breaking, breaking_text}]}" } }
  /api/v1/me/notifications:
    get:
      tags: [auth]
      summary: "Notification settings: ntfy address, channels per topic (digest, overdue, sensor, winter), repeat, quiet hours. The ntfy token is never returned (ntfy_token_set)"
      responses: { "200": { description: "settings" } }
    put:
      tags: [auth]
      summary: "Replace notification settings; ntfy_token omitted = keep, \"\" = remove. Repeat hours: overdue 0/6/12/24, sensor 0/1/6/12/24, winter 0/24 (0 = only once)"
      responses: { "200": { description: "saved settings" }, "422": { description: "invalid value" } }
  /api/v1/admin/smtp:
    get:
      tags: [admin]
      summary: "E-mail server settings (admin). source: app | env | none; the password is never returned (password_set)"
      responses: { "200": { description: "settings" }, "403": { description: "not an administrator" } }
    put:
      tags: [admin]
      summary: "Save SMTP settings (take effect immediately, precedence over SMTP_*); host \"\" removes them; password omitted = keep, \"\" = remove"
      responses: { "200": { description: "saved settings" }, "422": { description: "invalid value" } }
  /api/v1/admin/smtp/test:
    post:
      tags: [admin]
      summary: "Send a test e-mail to the administrator"
      responses: { "204": { description: "sent" }, "502": { description: "SMTP failed (title explains)" } }
  /api/v1/admin/offsite:
    get:
      tags: [admin]
      summary: "Off-site backup (WebDAV) settings and status {enabled, url, user, password_set, keep, status{last_name, last_success, last_error, last_error_at, last_bytes, last_photos, running, local_latest}}"
      responses: { "200": { description: "settings" }, "403": { description: "not an administrator" } }
    put:
      tags: [admin]
      summary: "Save off-site backup settings; password omitted = keep, \"\" = remove; keep = remote backups to keep (1–365)"
      responses: { "200": { description: "saved settings" }, "422": { description: "invalid value" } }
  /api/v1/admin/offsite/test:
    post:
      tags: [admin]
      summary: "Check WebDAV address and login (creates the folder if missing)"
      responses: { "204": { description: "reachable" }, "502": { description: "WebDAV failed (title explains)" } }
  /api/v1/admin/offsite/run:
    post:
      tags: [admin]
      summary: "Upload the newest local backup now (in the background; status via GET /admin/offsite)"
      responses: { "202": { description: "started" }, "422": { description: "not set up" } }
  /api/v1/admin/mqtt:
    get:
      tags: [admin]
      summary: "Home Assistant via MQTT: broker settings and status {enabled, url, user, password_set, prefix, owner, status{connected, last_sync, last_error, last_error_at, colonies}}"
      responses: { "200": { description: "settings" }, "403": { description: "not an administrator" } }
    put:
      tags: [admin]
      summary: "Save the MQTT broker (url: host, host:port or mqtt(s)://host:port; prefix: discovery prefix, default homeassistant); password omitted = keep, \"\" = remove. From now on the colonies of this administrator are announced to Home Assistant (MQTT discovery); switching off removes them there"
      responses: { "200": { description: "saved settings" }, "422": { description: "invalid value" } }
  /api/v1/admin/mqtt/test:
    post:
      tags: [admin]
      summary: "Connect to the saved MQTT broker once (address and login)"
      responses: { "204": { description: "reachable" }, "502": { description: "MQTT failed (title explains)" }, "422": { description: "not set up" } }
  /api/v1/snooze:
    post:
      tags: [colonies]
      security: []
      summary: "„Morgen“ button of an ntfy notification: signed link (7 days). k=care → care of the colony due by today counts as due tomorrow; k=winter → planned winter start/end +1 day"
      responses: { "200": { description: "{message}" }, "401": { description: "link invalid or expired" } }
  /api/v1/me/notifications/test:
    post:
      tags: [auth]
      summary: "Send a test message via the saved ntfy address"
      responses: { "204": { description: "sent" }, "502": { description: "ntfy refused or unreachable (title explains)" } }
  /api/v1/me/feed:
    get:
      tags: [auth]
      summary: "Whether a calendar address exists ({active, created_at, last_used_at}); never the token"
      responses: { "200": { description: "info" } }
    post:
      tags: [auth]
      summary: "Create a new calendar address; an existing one stops working. The token is returned only here"
      responses: { "201": { description: "{token, calendar_url}" } }
    delete:
      tags: [auth]
      summary: "Switch the calendar address off"
      responses: { "204": { description: "removed" } }
  /api/v1/feeds/{token}/calendar.ics:
    get:
      tags: [colonies]
      security: []
      summary: "Calendar subscription (iCal): next due date of every care plan (overdue ones today), planned winter rest start/end, open tasks. Read-only, token from /me/feed"
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: "text/calendar" }, "404": { description: "unknown token" } }
  /api/v1/export/link:
    post:
      tags: [colonies]
      summary: "Signed ZIP download link (5 min, bound to the session) for opening in a browser without login"
      parameters:
        - { name: photos, in: query, schema: { type: string, enum: ["0", "1"] }, description: "0 = without photos" }
      responses: { "200": { description: "{url, expires_at}; url is relative to the server" } }
  /api/v1/export/download:
    get:
      tags: [colonies]
      summary: "ZIP export via a link from /export/link; no Authorization header"
      security: []
      responses:
        "200": { description: "file download (application/zip)" }
        "401": { description: "link invalid, expired or session signed out" }
  /api/v1/colonies:
    get:
      tags: [colonies]
      summary: "List colonies with due status"
      parameters:
        - { name: q, in: query, schema: { type: string }, description: "name, species, genus, code, location path, #number" }
        - { name: status, in: query, schema: { type: string }, description: "comma-separated" }
        - { name: location_id, in: query, schema: { type: string, format: uuid }, description: "includes sub-locations" }
        - { name: species_id, in: query, schema: { type: string, format: uuid } }
        - { name: genus, in: query, schema: { type: string } }
        - { name: due, in: query, schema: { enum: [overdue, today, feeding, water, cleaning] } }
        - { name: size_min, in: query, schema: { type: integer } }
        - { name: archived, in: query, schema: { type: boolean } }
        - { name: sort, in: query, schema: { enum: [urgency, name, number, species, location] } }
      responses: { "200": { description: "list" } }
    post:
      tags: [colonies]
      summary: "Create a colony (an active QR code is created unless `?qr=false`)"
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { $ref: "#/components/requestBodies/Entity" }
      responses:
        "201": { $ref: "#/components/responses/Write" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/colonies/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [colonies]
      summary: "Colony start page (colony, due tasks, last feeding, scan links, recent timeline, winter rest)"
      responses:
        "200": { description: "overview" }
        "404": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [colonies]
      summary: "Update fields"
      parameters: [{ $ref: "#/components/parameters/IfMatch" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { $ref: "#/components/requestBodies/Entity" }
      responses: { "200": { $ref: "#/components/responses/Write" } }
    delete:
      tags: [colonies]
      summary: "Delete (tombstone, owner only)"
      responses: { "204": { description: "deleted" } }
  /api/v1/colonies/{id}/archive:
    post: { tags: [colonies], summary: "Archive (owner only)", parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "200": { $ref: "#/components/responses/Write" } } }
  /api/v1/colonies/{id}/unarchive:
    post: { tags: [colonies], summary: "Unarchive", parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "200": { $ref: "#/components/responses/Write" } } }
  /api/v1/colonies/{id}/timeline:
    get:
      tags: [colonies]
      summary: "Events, newest first"
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: types, in: query, schema: { type: string }, description: "comma-separated event types" }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses: { "200": { description: "{events, next}" } }
  /api/v1/colonies/{id}/due:
    get: { tags: [colonies], summary: "Due care tasks with traffic light", parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "200": { description: "ok" } } }
  /api/v1/colonies/{id}/feedings/repeat-last:
    post:
      tags: [colonies]
      summary: "Repeat the last feeding (items copied, acceptance unknown, time = now or occurred_at)"
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { id: { type: string, format: uuid }, occurred_at: { type: string, format: date-time } } }
      responses:
        "201": { $ref: "#/components/responses/Write" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/colonies/{id}/members:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get: { tags: [colonies], summary: "Members (e-mails only visible to the owner)", responses: { "200": { description: "ok" } } }
    post:
      tags: [colonies]
      summary: "Share with an existing account (owner only)"
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [email, role], properties: { email: { type: string }, role: { enum: [editor, viewer] } } }
      responses: { "200": { description: "members" } }
  /api/v1/colonies/{id}/members/{userId}:
    delete:
      tags: [colonies]
      summary: "Remove a member (owner) or leave (member)"
      parameters: [{ $ref: "#/components/parameters/Id" }, { name: userId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "204": { description: "removed" } }
  /api/v1/colonies/{id}/scan-links/regenerate:
    post:
      tags: [scan]
      summary: "Deactivate the current QR code and create a new one"
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "201": { description: "new scan link" } }

  /api/v1/scan/{token}:
    get:
      tags: [scan]
      summary: "Resolve a QR/NFC token to a colony (only with access; never grants rights)"
      parameters: [{ $ref: "#/components/parameters/Token" }]
      responses:
        "200":
          description: "resolved"
          content:
            application/json:
              schema: { type: object, properties: { colony_id: { type: string, format: uuid }, scan_link_id: { type: string, format: uuid }, kind: { enum: [qr, nfc] } } }
        "404": { $ref: "#/components/responses/Problem" }
        "410": { description: "code deactivated (`scan.revoked`)" }
  /api/v1/scan/nfc-uid:
    post:
      tags: [scan]
      summary: "Resolve a tag by hashed hardware UID (tags without our URL)"
      requestBody:
        content: { application/json: { schema: { type: object, properties: { uid_hash: { type: string, description: "64 hex chars" } } } } }
      responses: { "200": { description: "resolved" }, "404": { $ref: "#/components/responses/Problem" } }
  /api/v1/scan-links/{id}/qr.svg:
    get: { tags: [scan], summary: "QR code as SVG", parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "200": { description: "image/svg+xml" } } }
  /api/v1/scan-links/{id}/qr.png:
    get: { tags: [scan], summary: "QR code as PNG (512 px)", parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "200": { description: "image/png" } } }

  /api/v1/photos/{id}/content:
    put:
      tags: [photos]
      summary: "Upload the image of an existing photo record (JPEG/PNG/WebP; re-encoded, metadata/GPS removed; idempotent)"
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: Content-SHA256, in: header, schema: { type: string }, description: "hex SHA-256 of the body" }
      requestBody: { content: { image/jpeg: {}, image/png: {}, image/webp: {} } }
      responses:
        "200": { description: "photo record" }
        "409": { description: "another file was already uploaded" }
        "413": { description: "too large" }
        "415": { description: "unsupported type" }
  /api/v1/photos/{id}/url:
    get:
      tags: [photos]
      summary: "Short-lived signed URL (5 min)"
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: variant, in: query, schema: { enum: [thumb, display, original], default: display } }
      responses: { "200": { description: "{url, expires_at}" }, "409": { description: "not uploaded yet" } }
  /files/{key}:
    get:
      tags: [photos]
      security: []
      summary: "File delivery (valid signature required)"
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
        - { name: exp, in: query, required: true, schema: { type: integer } }
        - { name: sig, in: query, required: true, schema: { type: string } }
      responses: { "200": { description: "image" }, "403": { description: "invalid or expired signature" } }

  /api/v1/sensors/{id}/measurements:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [sensors]
      security: [{ sensorKey: [] }]
      summary: "Ingest readings (sensor API key; only for this sensor; duplicates ignored)"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                readings:
                  type: array
                  maxItems: 500
                  items:
                    type: object
                    required: [metric, value]
                    properties:
                      metric: { enum: [temperature, humidity] }
                      value: { type: number }
                      measured_at: { type: string, format: date-time }
      responses: { "202": { description: "{stored, received}" }, "401": { $ref: "#/components/responses/Problem" } }
    get:
      tags: [sensors]
      summary: "Aggregated readings"
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: bucket, in: query, schema: { type: string, default: 1h } }
      responses: { "200": { description: "buckets" } }
  /api/v1/sensors/{id}/rotate-key:
    post: { tags: [sensors], summary: "New API key (old one stops working)", parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "200": { description: "{api_key}" } } }

  /api/v1/invitations:
    get: { tags: [admin], summary: "Own invitations (admins see all)", responses: { "200": { description: "list" } } }
    post:
      tags: [admin]
      summary: "Create an invitation (admins; colony owners may invite into a colony)"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                colony_id: { type: string, format: uuid }
                colony_role: { enum: [editor, viewer] }
                valid_days: { type: integer, default: 7, maximum: 30 }
      responses: { "201": { description: "invitation incl. one-time link" } }
  /api/v1/invitations/{id}:
    delete: { tags: [admin], summary: "Withdraw an invitation", parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "204": { description: "deleted" } } }
  /api/v1/admin/users:
    get: { tags: [admin], summary: "Users with usage metadata (never colony contents)", responses: { "200": { description: "list" }, "403": { $ref: "#/components/responses/Problem" } } }
  /api/v1/admin/users/{id}:
    patch:
      tags: [admin]
      summary: "Disable/enable, change instance role"
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { disabled: { type: boolean }, instance_role: { enum: [admin, user] } } } } }
      responses: { "204": { description: "updated" } }
  /api/v1/admin/users/{id}/password-reset-link:
    post: { tags: [admin], summary: "Reset link without e-mail (30 min)", parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "201": { description: "link" } } }
  /api/v1/admin/system:
    get: { tags: [admin], summary: "Version, schema, sizes, backup status, configuration warnings", responses: { "200": { description: "info" } } }

  /api/v1/{collection}:
    parameters: [{ $ref: "#/components/parameters/Collection" }]
    get:
      tags: [collections]
      summary: "List visible records (optionally `?colony_id=`); events → use the timeline"
      parameters: [{ name: colony_id, in: query, schema: { type: string, format: uuid } }]
      responses: { "200": { description: "{items}" } }
    post:
      tags: [collections]
      summary: "Create (`id` may be supplied by the client)"
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { $ref: "#/components/requestBodies/Entity" }
      responses: { "201": { $ref: "#/components/responses/Write" }, "422": { $ref: "#/components/responses/Problem" } }
  /api/v1/{collection}/{id}:
    parameters: [{ $ref: "#/components/parameters/Collection" }, { $ref: "#/components/parameters/Id" }]
    get: { tags: [collections], summary: "One record", responses: { "200": { description: "record" }, "404": { $ref: "#/components/responses/Problem" } } }
    patch:
      tags: [collections]
      summary: "Update"
      parameters: [{ $ref: "#/components/parameters/IfMatch" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { $ref: "#/components/requestBodies/Entity" }
      responses: { "200": { $ref: "#/components/responses/Write" } }
    delete: { tags: [collections], summary: "Delete (tombstone)", responses: { "204": { description: "deleted" } } }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT, description: "Access token (15 min)" }
    sensorKey: { type: http, scheme: bearer, description: "Sensor key acm_sk_<prefix>_<secret>" }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    Token: { name: token, in: path, required: true, schema: { type: string, pattern: "^[0-9A-Za-z]{16}$" } }
    Collection: { name: collection, in: path, required: true, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, schema: { type: string, format: uuid } }
    IfMatch: { name: If-Match, in: header, schema: { type: string }, description: 'base version, e.g. "1842"' }
    ClientHeader: { name: X-ACM-Client, in: header, schema: { enum: [web] } }
  requestBodies:
    Register:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password]
            properties:
              email: { type: string }
              password: { type: string, minLength: 10 }
              display_name: { type: string }
              invite_token: { type: string }
              setup_token: { type: string }
              device: { $ref: "#/components/schemas/Device" }
    Entity:
      required: true
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
  responses:
    Problem:
      description: "error"
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Session:
      description: "tokens and user"
      content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } }
    Write:
      description: "written record"
      headers: { ETag: { schema: { type: string }, description: "new version" } }
      content: { application/json: { schema: { $ref: "#/components/schemas/WriteResponse" } } }
  schemas:
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string, examples: [colony.not_found, validation, auth.unauthorized, sync.resync_required, rate_limited] }
        field: { type: string }
        request_id: { type: string }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        display_name: { type: string }
        instance_role: { enum: [admin, user] }
        created_at: { type: string, format: date-time }
    Session:
      type: object
      properties:
        access_token: { type: string }
        access_expires_at: { type: string, format: date-time }
        refresh_token: { type: string, description: "omitted for web clients (cookie)" }
        refresh_expires_at: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/User" }
    Device:
      type: object
      properties:
        device_id: { type: string, format: uuid }
        device_name: { type: string }
        platform: { enum: [android, ios, web] }
        app_version: { type: string }
    Op:
      type: object
      required: [op_id, entity, entity_id, op]
      properties:
        op_id: { type: string, format: uuid, description: "unique per operation – retries reuse it" }
        entity: { type: string, examples: [colony_events, colonies, locations, scan_links] }
        entity_id: { type: string, format: uuid }
        op: { enum: [create, update, delete] }
        payload: { type: object, description: "create: full record (events incl. details); update: changed fields only" }
        base_version: { type: integer, format: int64, description: "server version the edit was based on" }
        created_at: { type: string, format: date-time, description: "device time of the edit (conflict resolution)" }
    OpResult:
      type: object
      properties:
        op_id: { type: string, format: uuid }
        entity_id: { type: string, format: uuid }
        status: { enum: [applied, duplicate, merged, rejected] }
        version: { type: integer, format: int64 }
        conflicts: { type: array, items: { type: string } }
        ignored_fields: { type: array, items: { type: string } }
        error: { $ref: "#/components/schemas/Problem" }
        extra: { type: object, description: "one-time values, e.g. sensor api_key" }
    Change:
      type: object
      properties:
        seq: { type: integer, format: int64 }
        entity: { type: string }
        op: { enum: [upsert, delete] }
        id: { type: string, format: uuid }
        data: { type: object }
    WriteResponse:
      type: object
      properties:
        data: { type: object }
        status: { enum: [applied, duplicate, merged] }
        conflicts: { type: array, items: { type: string } }
        ignored_fields: { type: array, items: { type: string } }
        extra: { type: object }
    EventPayload:
      description: "Payload of an colony_events create op. Detail objects depend on `type`."
      type: object
      required: [colony_id, type]
      properties:
        colony_id: { type: string, format: uuid }
        type: { enum: [feeding, water, cleaning, check, note, problem, photo, measurement, census, brood, habitat_move, queen, winter_start, winter_end, status_change, custom_task] }
        occurred_at: { type: string, format: date-time }
        note: { type: string }
        severity: { enum: [info, warning, critical] }
        care_round_id: { type: string, format: uuid }
        feeding:
          type: object
          properties:
            acceptance: { enum: [accepted, partial, ignored, unknown] }
            items:
              type: array
              minItems: 1
              items:
                type: object
                properties:
                  food_item_id: { type: string, format: uuid }
                  food_name: { type: string }
                  category: { enum: [protein, carbohydrate, other] }
                  quantity: { type: number }
                  unit: { enum: [piece, drop, ml, g, portion] }
                  size: { enum: [tiny, small, medium, large] }
        water: { type: object, properties: { kinds: { type: array, items: { enum: [drinker_refilled, nest_moistened, tank_refilled, water_changed] } } } }
        cleaning: { type: object, properties: { kinds: { type: array, items: { enum: [arena, food_remains, midden, glass, drinker, nest, nest_changed, other] } } } }
        measurements: { type: array, items: { type: object, properties: { metric: { enum: [temperature, humidity] }, value: { type: number }, place: { enum: [nest, arena, room, other] } } } }
        census: { type: object, properties: { exact_count: { type: integer }, estimate_min: { type: integer }, estimate_max: { type: integer } } }
        brood: { type: array, items: { type: object, properties: { stage: { enum: [eggs, larvae, pupae, naked_pupae, alates] }, exact_count: { type: integer }, level: { enum: [none, few, medium, many] } } } }
        habitat_move: { type: object, properties: { from_habitat_id: { type: string, format: uuid }, to_habitat_id: { type: string, format: uuid }, reason: { type: string } } }
        queen: { type: object, properties: { queen_id: { type: string, format: uuid }, action: { enum: [added, died, removed, observed] } } }
