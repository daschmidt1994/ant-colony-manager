# Nginx in front of Ant Colony Manager (without the bundled Caddy).
# .env: APP_BIND=127.0.0.1  TRUSTED_PROXIES=127.0.0.1  PUBLIC_APP_URL=https://ants.example.com
server {
    listen 443 ssl;
    http2 on;
    server_name ants.example.com;

    ssl_certificate     /etc/letsencrypt/live/ants.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ants.example.com/privkey.pem;

    client_max_body_size 64m;   # photo uploads (UPLOAD_MAX_MB)

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Realtime signals (Server-Sent Events) must not be buffered.
    location /api/v1/sync/events {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}

server {
    listen 80;
    server_name ants.example.com;
    return 301 https://$host$request_uri;
}
