name: App

on:
  push:
    paths: ["app/**", "test-vectors/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", "test-vectors/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.0"

jobs:
  check:
    name: Analyze, test, build web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        if: success() || failure() # also report tests when analysis failed
        run: flutter test --reporter expanded
      - name: Build web
        run: |
          ./tool/fetch_web_assets.sh
          flutter build web --release --wasm --no-web-resources-cdn --no-source-maps
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: app/build/web
          retention-days: 14

  android:
    name: Build APK
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: ant-colony-manager-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
