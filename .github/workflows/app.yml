name: App

on:
  push:
    paths: ["app/**", "test-vectors/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", "test-vectors/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.0"

jobs:
  check:
    name: Analyze, test, build web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        if: success() || failure() # also report tests when analysis failed
        run: flutter test --reporter expanded
      - name: Build web
        run: |
          ./tool/fetch_web_assets.sh
          flutter build web --release --wasm --no-web-resources-cdn --no-source-maps
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: app/build/web
          retention-days: 14

  android:
    name: Build APK
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: ant-colony-manager-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  contract:
    name: Contract test against the real server
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: acm
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Start server
        working-directory: server
        env:
          PUBLIC_APP_URL: http://127.0.0.1:8080
          DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/acm?sslmode=disable
          SETUP_TOKEN: contract-setup-token-123
          STORAGE_PATH: /tmp/acm-uploads
          LOG_FORMAT: text
        run: |
          export JWT_SECRET=$(openssl rand -base64 48) INSTANCE_SECRET=$(openssl rand -base64 48)
          go build -o /tmp/acm ./cmd/acm
          nohup /tmp/acm serve > /tmp/acm.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8080/readyz && break; sleep 1; done
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Contract test
        working-directory: app
        env:
          ACM_TEST_SERVER: http://127.0.0.1:8080
          ACM_TEST_SETUP_TOKEN: contract-setup-token-123
        run: |
          flutter pub get
          flutter test test/server_contract_test.dart --reporter expanded
      - name: Server log
        if: failure()
        run: cat /tmp/acm.log
