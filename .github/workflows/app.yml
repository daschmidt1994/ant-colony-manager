name: App

# Releases come only from version tags (v1.2.3, created by scripts/release.sh):
# GitHub release "v1.2.3" with the APKs + F-Droid update. Pushes to dev build
# the test app "ACM Test" (at.antcolony.manager.dev) into the same F-Droid repo.
# Other branches only test and build (APK as workflow artifact).
on:
  push:
    branches: ["**"]
    paths: ["app/**", "test-vectors/**", "fdroid/**", ".github/workflows/app.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["app/**", "test-vectors/**"]
  workflow_dispatch:
    inputs:
      app_link_host:
        description: "Domain für verifizierte App Links (z. B. ants.example.com) – leer = Standard-APK"
        required: false
        default: ""

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.0"

jobs:
  check:
    name: Analyze, test, build web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(sed -nE 's/^version: *([^+ ]+).*/\1/p' pubspec.yaml)
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME passt nicht zu pubspec.yaml ($V) – scripts/release.sh benutzen"; exit 1; }
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        if: success() || failure() # also report tests when analysis failed
        run: flutter test --reporter expanded
      - name: Label previews (PNG from the PDFs written by the tests)
        if: success() || failure()
        run: |
          [ -d build/label-previews ] || exit 0
          sudo apt-get install -y -qq poppler-utils >/dev/null
          for f in build/label-previews/*.pdf; do pdftoppm -png -r 110 -f 1 -l 2 "$f" "${f%.pdf}"; done
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: label-previews
          path: app/build/label-previews
          if-no-files-found: ignore
      - name: Build web
        run: |
          ./tool/fetch_web_assets.sh
          flutter build web --release --wasm --no-web-resources-cdn --no-source-maps
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: app/build/web
          retention-days: 14

  android:
    name: Build APK
    needs: check
    runs-on: ubuntu-latest
    # one publisher at a time: releases and the F-Droid repo on gh-pages
    concurrency:
      group: app-publish-${{ startsWith(github.ref, 'refs/tags/v') && 'release' || github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write # GitHub release with the APKs (version tags only)
    env:
      # dev → test app (own app ID, installs next to the real app)
      DEV: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Release signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "no signing secrets – debug-signed APK"; exit 0; fi
          echo "$KEYSTORE" | base64 -d > android/app/upload.jks
          printf 'storeFile=upload.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' "$PASSWORD" "$PASSWORD" "$ALIAS" > android/key.properties
          echo "Certificate SHA-256 (for ANDROID_CERT_SHA256 on the server):"
          keytool -list -v -keystore android/app/upload.jks -storepass "$PASSWORD" | grep 'SHA256:'
      - name: Build APK
        env:
          # test app: only the test domain (never the real one's App Links)
          ORG_GRADLE_PROJECT_appLinkHost: ${{ inputs.app_link_host || (env.DEV == 'true' && (vars.APP_LINK_HOST_DEV || 'applinks.invalid')) || vars.APP_LINK_HOST }}
          ORG_GRADLE_PROJECT_devBuild: ${{ env.DEV }}
          RUN: ${{ github.run_number }}
        # one APK per CPU architecture keeps downloads small (most phones: arm64-v8a)
        run: |
          V=$(sed -nE 's/^version: *([^+ ]+).*/\1/p' pubspec.yaml)
          # same version as the server image: tag → 1.2.3, otherwise 1.2.3-dev.<commit>
          [ "$GITHUB_REF_TYPE" = tag ] || V="$V-dev.${GITHUB_SHA::7}"
          if [ "$DEV" = "true" ]; then
            flutter build apk --release --split-per-abi --build-number="$RUN" \
              --build-name="$V" --dart-define=ACM_VERSION="$V" --dart-define=ACM_TEST_BUILD=true
          else
            flutter build apk --release --split-per-abi --build-number="$RUN" --dart-define=ACM_VERSION="$V"
          fi
      - name: Verify signature
        run: |
          SDK=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          APKSIGNER=$(find "$SDK/build-tools" -name apksigner -type f | sort -V | tail -1)
          ls -lh build/app/outputs/flutter-apk/*.apk
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | grep -E 'certificate (DN|SHA-256)'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEV == 'true' && 'acm-test-apk' || 'ant-colony-manager-apk' }}
          path: app/build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 30
      # Public download without a GitHub account; a stable link always points to the newest:
      # https://github.com/<owner>/<repo>/releases/latest/download/app-arm64-v8a-release.apk
      - name: Publish release (version tag)
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" build/app/outputs/flutter-apk/app-*-release.apk ../deploy/docker-compose.yml \
            --repo "$GITHUB_REPOSITORY" --verify-tag --latest --generate-notes \
            --title "Ant Colony Manager $V" \
            --notes "**Android-App:** app-arm64-v8a-release.apk (fast alle Handys), ältere Geräte: app-armeabi-v7a-release.apk. Über eine vorhandene Installation installieren – die Daten bleiben erhalten. Updates automatisch über F-Droid: docs/18-fdroid.md

          **Server:** Docker-Images \`ghcr.io/${GITHUB_REPOSITORY_OWNER}/ant-colony-manager:$V\` (und \`:latest\`), fest mit \`ACM_VERSION=$V\`. docker-compose.yml zum Einfügen in Dockhand/Portainer: docs/17-unraid-dockhand.md"
      # Own F-Droid repo on GitHub Pages – add in F-Droid for updates on the phone:
      # https://<owner>.github.io/<repo>/fdroid/repo (see docs/18-fdroid.md)
      - name: Update F-Droid repo (version tag → app, dev → test app)
        if: (startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push') || env.DEV == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_number }}
          PKG: ${{ env.DEV == 'true' && 'at.antcolony.manager.dev' || 'at.antcolony.manager' }}
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
          FDROID_KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
        run: |
          pipx install fdroidserver >/dev/null
          ./fdroid/publish.sh

  contract:
    name: Contract test against the real server
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: acm
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Start server
        working-directory: server
        env:
          PUBLIC_APP_URL: http://127.0.0.1:8080
          DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/acm?sslmode=disable
          SETUP_TOKEN: contract-setup-token-123
          STORAGE_PATH: /tmp/acm-uploads
          LOG_FORMAT: text
        run: |
          export JWT_SECRET=$(openssl rand -base64 48) INSTANCE_SECRET=$(openssl rand -base64 48)
          go build -o /tmp/acm ./cmd/acm
          nohup /tmp/acm serve > /tmp/acm.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8080/readyz && break; sleep 1; done
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Contract test
        working-directory: app
        env:
          ACM_TEST_SERVER: http://127.0.0.1:8080
          ACM_TEST_SETUP_TOKEN: contract-setup-token-123
        run: |
          flutter pub get
          flutter test test/server_contract_test.dart --reporter expanded
      - name: Server log
        if: failure()
        run: cat /tmp/acm.log

  web-smoke:
    name: Web app in a real browser (CSP, WASM, screenshots)
    needs: check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: acm
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: server/internal/webui/dist
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Start server with embedded web app
        working-directory: server
        env:
          PUBLIC_APP_URL: http://127.0.0.1:8080
          DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/acm?sslmode=disable
          SETUP_TOKEN: contract-setup-token-123
          STORAGE_PATH: /tmp/acm-uploads
          LOG_FORMAT: text
        run: |
          export JWT_SECRET=$(openssl rand -base64 48) INSTANCE_SECRET=$(openssl rand -base64 48)
          go build -o /tmp/acm ./cmd/acm
          nohup /tmp/acm serve > /tmp/acm.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8080/readyz && break; sleep 1; done
      - name: Seed data through the API
        run: |
          B=http://127.0.0.1:8080/api/v1
          T=$(curl -sf -X POST $B/setup -H 'Content-Type: application/json' -d '{"email":"contract@ants.test","password":"Contract-Test-2026","display_name":"Anna","setup_token":"contract-setup-token-123"}' | jq -r .access_token)
          H="Authorization: Bearer $T"
          LOC=$(curl -sf -X POST $B/locations -H "$H" -d '{"name":"Regal A"}' | jq -r .data.id)
          C=$(curl -sf -X POST $B/colonies -H "$H" -d "{\"name\":\"Messor #1\",\"species_text\":\"Messor barbarus\",\"location_id\":\"$LOC\"}" | jq -r .data.id)
          C2=$(curl -sf -X POST $B/colonies -H "$H" -d '{"name":"Lasius #2","species_text":"Lasius niger"}' | jq -r .data.id)
          for t in protein:3 water:2 cleaning:7; do
            curl -sf -X POST $B/schedules -H "$H" -d "{\"colony_id\":\"$C\",\"task_type\":\"${t%%:*}\",\"interval_days\":${t##*:},\"starts_at\":\"2026-01-01T00:00:00Z\"}" >/dev/null
          done
          curl -sf -X POST $B/schedules -H "$H" -d "{\"colony_id\":\"$C2\",\"task_type\":\"water\",\"interval_days\":30}" >/dev/null
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          curl -sf -X POST $B/events -H "$H" -d "{\"colony_id\":\"$C\",\"type\":\"feeding\",\"occurred_at\":\"$NOW\",\"feeding\":{\"items\":[{\"food_name\":\"Schabe\",\"category\":\"protein\",\"quantity\":2,\"unit\":\"piece\",\"size\":\"small\"},{\"food_name\":\"Zuckerwasser\",\"category\":\"carbohydrate\"}]}}" >/dev/null
          curl -sf -X POST $B/events -H "$H" -d "{\"colony_id\":\"$C\",\"type\":\"census\",\"census\":{\"estimate_min\":500,\"estimate_max\":1000}}" >/dev/null
          curl -sf -X POST $B/events -H "$H" -d "{\"colony_id\":\"$C\",\"type\":\"measurement\",\"measurements\":[{\"metric\":\"temperature\",\"value\":25.4},{\"metric\":\"humidity\",\"value\":61}]}" >/dev/null
          echo "$C" > app/colony_id
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Browser smoke test
        working-directory: app
        env:
          ACM_TEST_SERVER: http://127.0.0.1:8080
          COLONY_ID_FILE: colony_id
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          node tool/web_smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: app/screenshots
      - name: Server log
        if: failure()
        run: cat /tmp/acm.log
