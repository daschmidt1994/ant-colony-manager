name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    name: Backend tests (PostgreSQL 18, race detector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: go vet
        run: go vet ./...
      - name: go test
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
        run: go test -race -count=1 -p 1 ./...

  shell:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck -s sh -S warning scripts/*.sh deploy/backup/*.sh
      - run: shellcheck -S warning fdroid/publish.sh

  stack:
    name: Docker stack end-to-end (install, backup, restore, proxy)
    runs-on: ubuntu-latest
    needs: [server, shell]
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/test-stack.sh
