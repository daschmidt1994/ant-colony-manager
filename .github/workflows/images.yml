name: Images

# Multi-arch images (linux/amd64 + linux/arm64) on GitHub Container Registry.
# Tags: v1.2.3 → 1.2.3, 1.2, latest (newest release; the ready-made
# deploy/docker-compose.yml pulls latest) · main → edge (tested, unreleased state)
on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: ant-colony-manager
            context: .
            file: server/Dockerfile
          - image: ant-colony-manager-backup
            context: deploy/backup
            file: deploy/backup/Dockerfile
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(sed -nE 's/^version: *([^+ ]+).*/\1/p' app/pubspec.yaml)
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME passt nicht zu app/pubspec.yaml ($V) – scripts/release.sh benutzen"; exit 1; }
      - name: Build web app (server image only)
        if: matrix.image == 'ant-colony-manager'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true
      - if: matrix.image == 'ant-colony-manager'
        working-directory: app
        run: |
          flutter pub get
          ./tool/fetch_web_assets.sh
          flutter build web --release --wasm --no-web-resources-cdn --no-source-maps
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            WEB_BUILD=prebuilt
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
